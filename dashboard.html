
<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KPK Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>

  <div class="dashboard-grid"></div>

  <div class="soft-orb orb-one"></div>
  <div class="soft-orb orb-two"></div>

  <header class="dashboard-header">

    <div class="header-left">

      <h1 data-lang="dashboardTitle"></h1>

      <p data-lang="dashboardDesc"></p>

    </div>

    <div class="header-right">

      <!-- LANGUAGE -->
      <div class="lang-dropdown" id="langDropdown">

        <button class="lang-current" id="langCurrent" type="button">

          <span class="lang-left">

            <img
              src="./images/uz.png"
              class="flag-img"
              id="currentFlag"
              alt="flag"
            >

            <span id="currentLangText">UZ</span>

          </span>

          <i class="bi bi-chevron-down"></i>

        </button>

        <div class="lang-menu">

          <button
            class="lang-option active"
            data-lang-code="uz"
            type="button"
          >

            <img
              src="./images/uz.png"
              class="flag-img"
              alt="uz"
            >

            <span>Uzbek</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="en"
            type="button"
          >

            <img
              src="./images/en.png"
              class="flag-img"
              alt="en"
            >

            <span>English</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="ru"
            type="button"
          >

            <img
              src="./images/ru.png"
              class="flag-img"
              alt="ru"
            >

            <span>Русский</span>

          </button>

        </div>
      </div>

      <!-- PROFILE -->
      <div class="profile-wrapper" id="profileWrapper">

        <button class="profile-btn" id="profileBtn" type="button">

          <img
            id="profileImage"
            src="./images/user.png"
            alt="Profile"
          >

        </button>

        <div class="profile-menu" id="profileMenu">

          <div class="profile-info">

            <img
              id="menuProfileImage"
              src="./images/user.png"
              alt="Profile"
            >

            <div>

              <h3 id="profileName">User</h3>

              <p id="profileEmail">user@gmail.com</p>

              <span id="profileProvider"></span>

            </div>

          </div>

          <button
            class="profile-menu-item logout"
            type="button"
            id="logoutBtn"
          >

            <i class="bi bi-box-arrow-right"></i>

            <span data-lang="logout"></span>

          </button>

        </div>
      </div>

    </div>

  </header>

  <main class="dashboard-main">

    <section class="welcome-card">

      <div class="welcome-icon">
        <i class="bi bi-mortarboard"></i>
      </div>

      <h2 data-lang="welcomeDashboard"></h2>

      <p data-lang="welcomeDashboardText"></p>

    </section>

  </main>

  <script src="./JavaScript/dashboard.js"></script>
  <script type="module" src="./JavaScript/firebase.js"></script>

</body>

</html>
