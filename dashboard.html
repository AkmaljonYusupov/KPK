<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Assessment</title>

    <link rel="stylesheet"
        href="./css/assessment.css">
</head>

<body>

    <div class="assessment-container">

        <div class="header">

            <div class="header-text">
                <h1>Bilim Testi</h1>
                <p>Testni ishlang va dashboardga o'ting</p>
            </div>

            <div class="timer"
                id="timer">
                05:00
            </div>

        </div>

        <div class="info-cards">

            <div class="card">
                <h3>Savol</h3>
                <p id="questionNumber">
                    1 / 10
                </p>
            </div>

            <div class="card">
                <h3>To'g'ri</h3>
                <p id="score">
                    0
                </p>
            </div>

            <div class="card">
                <h3>Foiz</h3>
                <p id="percent">
                    0%
                </p>
            </div>

        </div>

        <div class="progress">

            <div class="progress-bar"
                id="progressBar"></div>

        </div>

        <div id="questionBox"></div>

        <div class="button-group">

            <button class="btn prev-btn"
                id="prevBtn">

                Ortga

            </button>

            <button class="btn next-btn"
                id="nextBtn">

                Keyingi

            </button>

        </div>

    </div>

    <script src="./JavaScript/assessment.js"></script>

</body>

</html>
