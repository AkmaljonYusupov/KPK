<!DOCTYPE html>
<html lang="uz">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KPK Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./css/dashboard.css"
  >

</head>

<body>

  <div class="dashboard-grid"></div>

  <div class="soft-orb orb-one"></div>
  <div class="soft-orb orb-two"></div>

  <header class="dashboard-header">

    <div class="header-left">

      <h1 data-lang="dashboardTitle"></h1>

      <p data-lang="dashboardDesc"></p>

    </div>

    <div class="header-right">

      <!-- LANGUAGE -->

      <div
        class="lang-dropdown"
        id="langDropdown"
      >

        <button
          class="lang-current"
          id="langCurrent"
          type="button"
        >

          <span class="lang-left">

            <img
              src="./images/uz.png"
              class="flag-img"
              id="currentFlag"
              alt="flag"
            >

            <span id="currentLangText">
              UZ
            </span>

          </span>

          <i class="bi bi-chevron-down"></i>

        </button>

        <div class="lang-menu">

          <button
            class="lang-option active"
            data-lang-code="uz"
            type="button"
          >

            <img
              src="./images/uz.png"
              class="flag-img"
              alt="uz"
            >

            <span>Uzbek</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="en"
            type="button"
          >

            <img
              src="./images/en.png"
              class="flag-img"
              alt="en"
            >

            <span>English</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="ru"
            type="button"
          >

            <img
              src="./images/ru.png"
              class="flag-img"
              alt="ru"
            >

            <span>Русский</span>

          </button>

        </div>

      </div>

      <!-- PROFILE -->

      <div
        class="profile-wrapper"
        id="profileWrapper"
      >

        <button
          class="profile-btn"
          id="profileBtn"
          type="button"
        >

          <img
            id="profileImage"
            src="./images/user.png"
            alt="Profile"
          >

        </button>

        <div
          class="profile-menu"
          id="profileMenu"
        >

          <div class="profile-info">

            <img
              id="menuProfileImage"
              src="./images/user.png"
              alt="Profile"
            >

            <div>

              <h3 id="profileName">
                User
              </h3>

              <p id="profileEmail">
                user@gmail.com
              </p>

              <span id="profileProvider"></span>

            </div>

          </div>

          <button
            class="profile-menu-item logout"
            type="button"
            id="logoutBtn"
          >

            <i class="bi bi-box-arrow-right"></i>

            <span data-lang="logout"></span>

          </button>

        </div>

      </div>

    </div>

  </header>

  <main class="dashboard-main">

    <!-- WELCOME -->

    <section class="welcome-card">

      <div class="welcome-icon">

        <i class="bi bi-mortarboard"></i>

      </div>

      <h2 data-lang="welcomeDashboard"></h2>

      <p data-lang="welcomeDashboardText"></p>

    </section>

    <!-- MODULES -->

    <section class="modules-section">

      <!-- MODULE 1 -->

      <div
        class="module-card"
        id="module1"
      >

        <div class="module-level beginner">

          BEGINNER

        </div>

        <h2>
          1-Bo‘lim
        </h2>

        <p>
          Boshlang‘ich daraja
        </p>

        <button
          class="module-btn"
          onclick="openModule(1)"
        >

          Ochish

        </button>

      </div>

      <!-- MODULE 2 -->

      <div
        class="module-card"
        id="module2"
      >

        <div class="module-level intermediate">

          INTERMEDIATE

        </div>

        <h2>
          2-Bo‘lim
        </h2>

        <p>
          56-70% oralig‘i
        </p>

        <button
          class="module-btn"
          onclick="openModule(2)"
        >

          Ochish

        </button>

      </div>

      <!-- MODULE 3 -->

      <div
        class="module-card"
        id="module3"
      >

        <div class="module-level advanced">

          ADVANCED

        </div>

        <h2>
          3-Bo‘lim
        </h2>

        <p>
          71-89% oralig‘i
        </p>

        <button
          class="module-btn"
          onclick="openModule(3)"
        >

          Ochish

        </button>

      </div>

      <!-- MODULE 4 -->

      <div
        class="module-card"
        id="module4"
      >

        <div class="module-level master">

          MASTER

        </div>

        <h2>
          4-Bo‘lim
        </h2>

        <p>
          90-100% oralig‘i
        </p>

        <button
          class="module-btn"
          onclick="openModule(4)"
        >

          Ochish

        </button>

      </div>

    </section>

  </main>

  <script src="./JavaScript/dashboard.js"></script>

  <script
    type="module"
    src="./JavaScript/firebase.js"
  ></script>

</body>

</html>
