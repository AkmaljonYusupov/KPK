<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>KPK Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/dashboard.css"/>
</head>

<body>

  <!-- GRID -->
  <div class="dashboard-grid"></div>

  <!-- ORBS -->
  <div class="soft-orb orb-one"></div>
  <div class="soft-orb orb-two"></div>

  <!-- HEADER -->
  <header class="dashboard-header">

    <div class="header-left">

      <h1 data-lang="dashboardTitle">
        Dashboard
      </h1>

      <p data-lang="dashboardDesc">
        KPK platformasiga xush kelibsiz
      </p>

    </div>

    <div class="header-right">

      <!-- LANGUAGE -->
      <div class="lang-dropdown" id="langDropdown">

        <button
          class="lang-current"
          id="langCurrent"
          type="button"
        >

          <span class="lang-left">

            <img
              src="./images/uz.png"
              id="currentFlag"
              class="flag-img"
              alt="flag"
            />

            <span id="currentLangText">
              UZ
            </span>

          </span>

          <i class="bi bi-chevron-down"></i>

        </button>

        <div class="lang-menu">

          <button
            class="lang-option active"
            data-lang-code="uz"
            type="button"
          >

            <img
              src="./images/uz.png"
              class="flag-img"
              alt="uz"
            />

            <span>Uzbek</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="en"
            type="button"
          >

            <img
              src="./images/en.png"
              class="flag-img"
              alt="en"
            />

            <span>English</span>

          </button>

          <button
            class="lang-option"
            data-lang-code="ru"
            type="button"
          >

            <img
              src="./images/ru.png"
              class="flag-img"
              alt="ru"
            />

            <span>Русский</span>

          </button>

        </div>
      </div>

      <!-- PROFILE -->
      <div class="profile-wrapper" id="profileWrapper">

        <button
          class="profile-btn"
          id="profileBtn"
          type="button"
        >

          <img
            id="profileImage"
            src="./images/user.png"
            alt="Profile"
          />

        </button>

        <div class="profile-menu" id="profileMenu">

          <div class="profile-info">

            <img
              id="menuProfileImage"
              src="./images/user.png"
              alt="Profile"
            />

            <div>

              <h3 id="profileName">
                User
              </h3>

              <p id="profileEmail">
                user@gmail.com
              </p>

              <span id="profileProvider">
                Google
              </span>

            </div>

          </div>

          <button
            class="profile-menu-item logout"
            id="logoutBtn"
            type="button"
          >

            <i class="bi bi-box-arrow-right"></i>

            <span data-lang="logout">
              Chiqish
            </span>

          </button>

        </div>
      </div>

    </div>

  </header>

  <!-- MAIN -->
  <main class="dashboard-main">

    <!-- MODULES -->
    <section class="modules-section">

      <!-- MODULE 1 -->
      <div
        class="module-card active"
        data-module="1"
      >

        <div class="module-top">

          <div class="module-badge beginner">

            BEGINNER

          </div>

          <div class="module-icon">

            <i class="bi bi-lightning-charge-fill"></i>

          </div>

        </div>

        <h2 data-lang="module1Title">
          1-Bo‘lim
        </h2>

        <p data-lang="module1Desc">
          Boshlang‘ich daraja
        </p>

        <div class="module-progress">

          <div class="module-progress-fill fill-25"></div>

        </div>

        <button class="module-btn">

          <i class="bi bi-play-fill"></i>

          <span data-lang="openModule">
            Ochish
          </span>

        </button>

      </div>

      <!-- MODULE 2 -->
      <div
        class="module-card"
        id="module2"
        data-module="2"
      >

        <div class="locked-overlay">

          <i class="bi bi-lock-fill"></i>

        </div>

        <div class="module-top">

          <div class="module-badge intermediate">

            INTERMEDIATE

          </div>

          <div class="module-icon">

            <i class="bi bi-stars"></i>

          </div>

        </div>

        <h2 data-lang="module2Title">
          2-Bo‘lim
        </h2>

        <p data-lang="module2Desc">
          56-70% oralig‘i
        </p>

        <div class="module-progress">

          <div class="module-progress-fill fill-50"></div>

        </div>

        <button class="module-btn">

          <i class="bi bi-play-fill"></i>

          <span data-lang="openModule">
            Ochish
          </span>

        </button>

      </div>

      <!-- MODULE 3 -->
      <div
        class="module-card"
        id="module3"
        data-module="3"
      >

        <div class="locked-overlay">

          <i class="bi bi-lock-fill"></i>

        </div>

        <div class="module-top">

          <div class="module-badge advanced">

            ADVANCED

          </div>

          <div class="module-icon">

            <i class="bi bi-rocket-takeoff-fill"></i>

          </div>

        </div>

        <h2 data-lang="module3Title">
          3-Bo‘lim
        </h2>

        <p data-lang="module3Desc">
          71-89% oralig‘i
        </p>

        <div class="module-progress">

          <div class="module-progress-fill fill-75"></div>

        </div>

        <button class="module-btn">

          <i class="bi bi-play-fill"></i>

          <span data-lang="openModule">
            Ochish
          </span>

        </button>

      </div>

      <!-- MODULE 4 -->
      <div
        class="module-card"
        id="module4"
        data-module="4"
      >

        <div class="locked-overlay">

          <i class="bi bi-lock-fill"></i>

        </div>

        <div class="module-top">

          <div class="module-badge master">

            MASTER

          </div>

          <div class="module-icon">

            <i class="bi bi-trophy-fill"></i>

          </div>

        </div>

        <h2 data-lang="module4Title">
          4-Bo‘lim
        </h2>

        <p data-lang="module4Desc">
          90-100% oralig‘i
        </p>

        <div class="module-progress">

          <div class="module-progress-fill fill-100"></div>

        </div>

        <button class="module-btn">

          <i class="bi bi-play-fill"></i>

          <span data-lang="openModule">
            Ochish
          </span>

        </button>

      </div>

    </section>

  </main>

  <script src="./JavaScript/dashboard.js"></script>

  <script
    type="module"
    src="./JavaScript/firebase.js"
  ></script>

</body>
</html>
