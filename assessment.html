<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPK Assessment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/assessment.css">
</head>
<body>
  <div class="assessment-wrapper">
    <div class="assessment-card">
      <!-- HEADER -->
      <div class="assessment-header">
        <div class="assessment-icon">
          <i class="bi bi-mortarboard-fill"></i>
        </div>
        <div>
          <h1 data-lang="assessmentTitle">O‘quvchilar bilimini baholash</h1>
          <p data-lang="assessmentDesc">Test orqali bilim darajangiz aniqlanadi</p>
        </div>
      </div>

      <!-- TIMER -->
      <div class="timer-box">
        <i class="bi bi-stopwatch-fill"></i>
        <span data-lang="remainingTime">Umumiy vaqt:</span>
        <strong id="timer">20:00</strong>
      </div>

      <!-- PROGRESS -->
      <div class="progress custom-progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- SAVOL MAYDONI -->
      <div id="questionBox" class="question-container"></div>

      <!-- SAVOL TIMER -->
      <div class="question-timer">
        <i class="bi bi-hourglass-split"></i>
        <span data-lang="questionTime">Bu savol uchun vaqt:</span>
        <strong id="questionTimer">30</strong>
        <span data-lang="seconds">soniya</span>
      </div>

      <!-- NAVIGATION -->
      <div class="button-group">
        <button class="nav-btn prev-btn" id="prevBtn">
          <i class="bi bi-arrow-left-circle-fill"></i>
          <span data-lang="prev">Ortga</span>
        </button>
        <button class="nav-btn next-btn" id="nextBtn">
          <span data-lang="next">Keyingi</span>
          <i class="bi bi-arrow-right-circle-fill"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // TEST BIR MARTA ISHLASH HIMOYASI
    const progress = JSON.parse(localStorage.getItem("kpk-progress") || "{}");
    if (progress.initialTest && progress.initialTest.completed === true) {
      window.location.href = "dashboard.html";
    }
  </script>

  <script src="./JavaScript/assessment.js"></script>
</body>
</html>
